# Version updates for what the repository pins. Each ecosystem has a one-day cooldown, the
# same window as `exclude-newer` in pyproject.toml, with one exception: Dependabot applies it to
# the docker ecosystem only for Docker Hub images, so a pull request for the `ghcr.io/astral-sh/uv`
# stage is opened the day the release appears. Check the release's age before merging it.
#
# uv is also pinned in install.sh (UV_VERSION) and install.ps1 ($UvVersion). Dependabot cannot
# edit those, so a uv-stage pull request fails CI (a test compares the three) until the two
# scripts are changed to the same version in the same pull request.
#
# Not covered, because Dependabot cannot read them: the Trivy and Gitleaks versions and
# digests (Dockerfile build args, mirrored in install.sh). Bump those by hand, together.
version: 2
updates:
  # uv.lock and the constraints in pyproject.toml.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1

  # The pinned actions in .github/workflows and in the root action.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1

  # The `FROM` lines of the Dockerfile: the uv stage (version and digest) and the Python base.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    ignore:
      # Warden supports Python 3.11 and the image stays on it; a newer minor is a decision.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
