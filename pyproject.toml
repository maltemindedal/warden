[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "warden"
version = "0.1.0"
description = "Run Trivy, Semgrep, Gitleaks, and OWASP ZAP with one report and exit code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "maltemindedal" }]
dependencies = ["rich>=13.9,<16", "semgrep>=1.184.0,<2"]

[project.scripts]
warden = "warden.cli:main"
warden-config = "warden.config:main"
warden-aggregate = "warden.aggregate:main"

[dependency-groups]
dev = ["pytest>=9.2.0,<10", "pytest-cov>=7.1,<8", "ruff>=0.17.4,<0.18", "ty>=0.0.99,<0.1"]

[tool.uv]
default-groups = ["dev"]
# semgrep 1.146 to 1.172 pin mcp==1.23.3 (older releases pin older mcp releases or none), which
# carries GHSA-hvrp-rf83-w775, GHSA-jpw9-pfvf-9f58 and GHSA-vj7q-gjh5-988w. We only use semgrep's
# CLI scanner, never its MCP server, so the pin is overridden to a patched release. Capped below 2 because mcp 2.x
# renamed the modules semgrep imports, so `semgrep` fails at startup on a 2.x resolve.
# semgrep 1.173.0 through the locked 1.184.0 require mcp==1.29.0. uv.lock
# resolves mcp to 1.30.0 because this override replaces that pin with
# mcp>=1.28.1,<2. To put mcp back on semgrep's requirement, use
# `uv lock --upgrade-package mcp==1.29.0`.
override-dependencies = ["mcp>=1.28.1,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/warden"]

[tool.hatch.build.targets.sdist]
include = [
  "src/warden",
  "bin",
  "README.md",
  "LICENSE",
  "Dockerfile",
  "install.ps1",
  "install.sh",
  "action.yml",
  ".github/workflows/ci.yml",
]

[tool.pytest.ini_options]
# `tests` is on the path so the shared fake in tests/fakes.py imports by name, and `tools` so
# tests can import tools/sync_pins.py.
# ty's environment.root below must list the same roots.
pythonpath = ["src", "tests", "tools"]
testpaths = ["tests"]
# Fail on a misspelled marker or config key, on any warning, and on an xfail that starts passing.
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = ["error"]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
# S: security (bandit), BLE: blind `except`, PGH: blanket `noqa` / `type: ignore`,
# TID251: the names only `src/warden/_out.py` or `src/warden/_fs.py` may use (banned-api below).
select = ["B", "BLE", "E", "F", "I", "PGH", "S", "TID251", "UP", "W"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Only `_out.py` writes to the terminal: it escapes project text and survives a cp1252 stdout.
# ruff does not match the builtin `print`, so `tests/test_boundaries.py` covers that one.
"sys.stdout".msg = "Use warden._out.say() or json_document(): they escape project text and survive a cp1252 stdout."
"sys.stderr".msg = "Use warden._out.error() or say_err(): they escape project text."
"sys.__stdout__".msg = "Use warden._out.say() or json_document(): they escape project text and survive a cp1252 stdout."
"sys.__stderr__".msg = "Use warden._out.error() or say_err(): they escape project text."
"rich".msg = "Use warden._out.say_styled() or table(): they take text and a style name, never markup, and rich passes ESC and bidi characters through."
"argparse.ArgumentParser".msg = "Use warden._out.ArgumentParser: argparse echoes argv to stderr unescaped."
# The other ways a line reaches the terminal. Python prints the argument of `sys.exit("...")` and
# of `raise SystemExit("...")` to stderr as it is; ruff does not match the builtin `SystemExit`,
# so `tests/test_boundaries.py` covers that one.
"sys.exit".msg = "Return the status from main(), and say why with warden._out.error(): it escapes project text and returns 1."
"os.write".msg = "Use warden._out.say() or say_err(): they escape project text and survive a cp1252 stdout."
"logging".msg = "Use warden._out.say() or say_err(): a logging handler writes project text to stderr unescaped."
"warnings".msg = "Use warden._out.say() or say_err() with a line that starts `Warning: `: warnings.warn writes project text to stderr unescaped."
"traceback".msg = "Use warden._out.error(): a traceback prints project paths unescaped, and a file-system problem is a ProjectIOError that out.entry_point already reports."
# Only `_fs.py` touches the file system: a read there returns an outcome instead of raising,
# and everything else raises one type. ruff does not match the builtin `open` or a method on a
# `Path`, so `tests/test_boundaries.py` covers those, and runs every row here through ruff.
"io.open".msg = "Use warden._fs.read_text(path, accept=fs.Accept.REGULAR_NO_LINK, max_bytes=<the most you will hold>, encoding=...) or read_bytes(): they return an outcome instead of raising, so a project file cannot end the run in a traceback."
"os.open".msg = "Use warden._fs.read_text(path, accept=fs.Accept.REGULAR_NO_LINK, max_bytes=<the most you will hold>, encoding=...) or read_bytes(): they return an outcome instead of raising, so a project file cannot end the run in a traceback."
"os.fdopen".msg = "Use warden._fs.read_text(path, accept=fs.Accept.REGULAR_NO_LINK, max_bytes=<the most you will hold>, encoding=...) or read_bytes(): they return an outcome instead of raising, so a project file cannot end the run in a traceback."
"os.listdir".msg = "Use warden._fs.read_text(path, accept=fs.Accept.REGULAR_NO_LINK, max_bytes=<the most you will hold>, encoding=...) or read_bytes(): they return an outcome instead of raising, so a project file cannot end the run in a traceback."
"os.scandir".msg = "Use warden._fs.read_text(path, accept=fs.Accept.REGULAR_NO_LINK, max_bytes=<the most you will hold>, encoding=...) or read_bytes(): they return an outcome instead of raising, so a project file cannot end the run in a traceback."
"os.walk".msg = "Use warden._fs.read_text(path, accept=fs.Accept.REGULAR_NO_LINK, max_bytes=<the most you will hold>, encoding=...) or read_bytes(): they return an outcome instead of raising, so a project file cannot end the run in a traceback."
"glob".msg = "Use warden._fs.read_text(path, accept=fs.Accept.REGULAR_NO_LINK, max_bytes=<the most you will hold>, encoding=...) or read_bytes(): they return an outcome instead of raising, so a project file cannot end the run in a traceback."
"os.unlink".msg = "Use a warden._fs.WritableFile from owned_file() or as_given(): it raises only ProjectIOError and says what a symlink at the name means."
"os.remove".msg = "Use a warden._fs.WritableFile from owned_file() or as_given(): it raises only ProjectIOError and says what a symlink at the name means."
"os.rename".msg = "Use a warden._fs.WritableFile from owned_file() or as_given(): it raises only ProjectIOError and says what a symlink at the name means."
"os.replace".msg = "Use a warden._fs.WritableFile from owned_file() or as_given(): it raises only ProjectIOError and says what a symlink at the name means."
"os.rmdir".msg = "Use a warden._fs.WritableFile from owned_file() or as_given(): it raises only ProjectIOError and says what a symlink at the name means."
"os.removedirs".msg = "Use a warden._fs.WritableFile from owned_file() or as_given(): it raises only ProjectIOError and says what a symlink at the name means."
"os.truncate".msg = "Use a warden._fs.WritableFile from owned_file() or as_given(): it raises only ProjectIOError and says what a symlink at the name means."
"os.chmod".msg = "Use a warden._fs.WritableFile from owned_file() or as_given(): it raises only ProjectIOError and says what a symlink at the name means."
"os.symlink".msg = "Use a warden._fs.WritableFile from owned_file() or as_given(): it raises only ProjectIOError and says what a symlink at the name means."
"os.link".msg = "Use a warden._fs.WritableFile from owned_file() or as_given(): it raises only ProjectIOError and says what a symlink at the name means."
"os.mkdir".msg = "Use warden._fs.resolved(), is_dir(), owned_dir() or WritableFile.present(): they raise only ProjectIOError."
"os.makedirs".msg = "Use warden._fs.resolved(), is_dir(), owned_dir() or WritableFile.present(): they raise only ProjectIOError."
"os.stat".msg = "Use warden._fs.resolved(), is_dir(), owned_dir() or WritableFile.present(): they raise only ProjectIOError."
"os.lstat".msg = "Use warden._fs.resolved(), is_dir(), owned_dir() or WritableFile.present(): they raise only ProjectIOError."
"os.access".msg = "Use warden._fs.resolved(), is_dir(), owned_dir() or WritableFile.present(): they raise only ProjectIOError."
"os.readlink".msg = "Use warden._fs.resolved(), is_dir(), owned_dir() or WritableFile.present(): they raise only ProjectIOError."
"os.path".msg = "Use warden._fs.resolved(), is_dir(), owned_dir() or WritableFile.present(): they raise only ProjectIOError."
"shutil".msg = "Use warden._fs: it is the only module that touches the file system."
"tempfile".msg = "Use warden._fs: it is the only module that touches the file system."

[tool.ruff.lint.per-file-ignores]
# Tests assert by design and run fixed, list-form commands.
"tests/**" = ["S101", "S603", "S607"]
# The two boundaries are rules about the package: `_out.py` and `_fs.py` own the banned names,
# and tests, tools and skill scripts are neither Warden's output nor its reads of a project.
# ruff can only switch the rule off for a whole file, so `tests/test_boundaries.py` lints each of
# the two without this exemption and fails on a name that belongs to the other one.
"src/warden/_out.py" = ["TID251"]
"src/warden/_fs.py" = ["TID251"]
"!src/warden/**" = ["TID251"]

[tool.ruff.format]
# ruff 0.16 formats Markdown by default. Keep the check on Python files, which is what it
# covered before.
exclude = ["*.md"]
docstring-code-format = true
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.11"
root = ["src", "tests", "tools"]

[tool.ty.rules]
all = "error"
